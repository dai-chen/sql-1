calcite:
  logical: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalProject(sum(balance)=[$1], sum(balance + 100)=[$2], sum(balance - 100)=[$3], sum(balance * 100)=[$4], sum(balance / 100)=[$5], gender=[$0])
        LogicalAggregate(group=[{0}], sum(balance)=[CHECKED_LONG_SUM($1)], sum(balance + 100)=[CHECKED_LONG_SUM($2)], sum(balance - 100)=[CHECKED_LONG_SUM($3)], sum(balance * 100)=[CHECKED_LONG_SUM($4)], sum(balance / 100)=[CHECKED_LONG_SUM($5)])
          LogicalProject(gender=[$4], balance=[$7], $f6=[+($7, 100)], $f7=[-($7, 100)], $f8=[*($7, 100)], $f9=[DIVIDE($7, 100)])
            CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_bank]])
  physical: |
    EnumerableLimit(fetch=[10000])
      EnumerableCalc(expr#0..3=[{inputs}], expr#4=[100:BIGINT], expr#5=[*($t2, $t4)], expr#6=[+($t1, $t5)], expr#7=[-($t1, $t5)], expr#8=[*($t1, $t4)], sum(balance)=[$t1], sum(balance + 100)=[$t6], sum(balance - 100)=[$t7], sum(balance * 100)=[$t8], sum(balance / 100)=[$t3], gender=[$t0])
        EnumerableAggregate(group=[{0}], sum(balance)=[CHECKED_LONG_SUM($1)], sum(balance + 100)_COUNT=[COUNT($1)], sum(balance / 100)=[CHECKED_LONG_SUM($2)])
          EnumerableCalc(expr#0..18=[{inputs}], expr#19=[100], expr#20=[DIVIDE($t7, $t19)], gender=[$t4], balance=[$t7], $f5=[$t20])
            CalciteEnumerableIndexScan(table=[[OpenSearch, opensearch-sql_test_index_bank]])
  shardFragment: |
    LogicalAggregate(group=[{0}], sum(balance)=[$SUM0($1)], agg#1=[COUNT($1)], sum(balance + 100)=[$SUM0($2)], agg#3=[COUNT($2)], sum(balance - 100)=[$SUM0($3)], agg#5=[COUNT($3)], sum(balance * 100)=[$SUM0($4)], agg#7=[COUNT($4)], sum(balance / 100)=[$SUM0($5)], agg#9=[COUNT($5)])
      LogicalProject(gender=[$4], balance=[$7], $f6=[+($7, 100)], $f7=[-($7, 100)], $f8=[*($7, 100)], $f9=[DIVIDE($7, 100)])
        CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_bank]])
  combine: "MERGE_AGG{groupKeys:[0], aggs:[SUM0(1), SUM(2), SUM0(3), SUM(4), SUM0(5),\
    \ SUM(6), SUM0(7), SUM(8), SUM0(9), SUM(10)]}"
  coordinatorTree: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalProject(sum(balance)=[$1], sum(balance + 100)=[$2], sum(balance - 100)=[$3], sum(balance * 100)=[$4], sum(balance / 100)=[$5], gender=[$0])
        LogicalProject(gender=[$0], sum(balance)=[CASE(=($2, 0), null:BIGINT, $1)], sum(balance + 100)=[CASE(=($4, 0), null:BIGINT, $3)], sum(balance - 100)=[CASE(=($6, 0), null:BIGINT, $5)], sum(balance * 100)=[CASE(=($8, 0), null:BIGINT, $7)], sum(balance / 100)=[CASE(=($10, 0), null:BIGINT, $9)])
          LogicalTableScan(table=[[OpenSearch, _gathered_rows]])
