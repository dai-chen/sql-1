calcite:
  logical: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalProject(age=[$8], firstname=[$1])
        LogicalFilter(condition=[>($8, 30)])
          CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_account]])
  physical: |
    EnumerableLimit(fetch=[10000])
      EnumerableCalc(expr#0..16=[{inputs}], expr#17=[30], expr#18=[>($t8, $t17)], age=[$t8], firstname=[$t1], $condition=[$t18])
        CalciteEnumerableIndexScan(table=[[OpenSearch, opensearch-sql_test_index_account]])
  shardFragment: |
    LogicalSort(fetch=[10000])
      LogicalProject(age=[$8], firstname=[$1])
        LogicalFilter(condition=[>($8, 30)])
          CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_account]])
  combine: "LIMIT{n:10000}"
  coordinatorTree: |
    LogicalTableScan(table=[[OpenSearch, _gathered_rows]])
