calcite:
  logical: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalProject(avg(balance)=[$3], count()=[$4], age_range=[$0], state=[$1], gender=[$2])
        LogicalAggregate(group=[{0, 1, 2}], avg(balance)=[AVG($3)], count()=[COUNT()])
          LogicalProject(age_range=[CASE(<($10, 30), 'u30':VARCHAR, 'a30':VARCHAR)], state=[$9], gender=[$4], balance=[$7])
            CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_bank]])
  physical: |
    EnumerableLimit(fetch=[10000])
      EnumerableCalc(expr#0..4=[{inputs}], avg(balance)=[$t3], count()=[$t4], age_range=[$t0], state=[$t1], gender=[$t2])
        EnumerableAggregate(group=[{0, 1, 2}], avg(balance)=[AVG($3)], count()=[COUNT()])
          EnumerableCalc(expr#0..18=[{inputs}], expr#19=[30], expr#20=[<($t10, $t19)], expr#21=['u30':VARCHAR], expr#22=['a30':VARCHAR], expr#23=[CASE($t20, $t21, $t22)], age_range=[$t23], state=[$t9], gender=[$t4], balance=[$t7])
            CalciteEnumerableIndexScan(table=[[OpenSearch, opensearch-sql_test_index_bank]])
  shardFragment: |
    LogicalAggregate(group=[{0, 1, 2}], agg#0=[$SUM0($3)], agg#1=[COUNT($3)], count()=[COUNT()])
      LogicalProject(age_range=[CASE(<($10, 30), 'u30':VARCHAR, 'a30':VARCHAR)], state=[$9], gender=[$4], balance=[$7])
        CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_bank]])
  combine: "MERGE_AGG{groupKeys:[0, 1, 2], aggs:[SUM0(3), SUM(4), SUM(5)]}"
  coordinatorTree: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalProject(avg(balance)=[$3], count()=[$4], age_range=[$0], state=[$1], gender=[$2])
        LogicalProject(age_range=[$0], state=[$1], gender=[$2], avg(balance)=[/(CAST($3):DOUBLE, $4)], count()=[$5])
          LogicalProject(age_range=[$0], state=[$1], gender=[$2], $f3=[CASE(=($4, 0), null:BIGINT, $3)], $f4=[$4], count()=[$5])
            LogicalTableScan(table=[[OpenSearch, _gathered_rows]])
