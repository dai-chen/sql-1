calcite:
  logical: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalProject(avg_age=[$2], state=[$0], city=[$1])
        LogicalAggregate(group=[{0, 1}], avg_age=[AVG($2)])
          LogicalProject(state=[$7], city=[$5], age=[$8])
            LogicalFilter(condition=[>($8, 30)])
              CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_account]])
  physical: |
    EnumerableLimit(fetch=[10000])
      EnumerableCalc(expr#0..2=[{inputs}], avg_age=[$t2], state=[$t1], city=[$t0])
        EnumerableAggregate(group=[{5, 7}], avg_age=[AVG($8)])
          EnumerableCalc(expr#0..16=[{inputs}], expr#17=[30], expr#18=[>($t8, $t17)], proj#0..16=[{exprs}], $condition=[$t18])
            CalciteEnumerableIndexScan(table=[[OpenSearch, opensearch-sql_test_index_account]])
  shardFragment: |
    LogicalAggregate(group=[{0, 1}], agg#0=[$SUM0($2)], agg#1=[COUNT($2)])
      LogicalProject(state=[$7], city=[$5], age=[$8])
        LogicalFilter(condition=[>($8, 30)])
          CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_account]])
  combine: "MERGE_AGG{groupKeys:[0, 1], aggs:[SUM0(2), SUM(3)]}"
  coordinatorTree: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalProject(avg_age=[$2], state=[$0], city=[$1])
        LogicalProject(state=[$0], city=[$1], avg_age=[/(CAST($2):DOUBLE, $3)])
          LogicalProject(state=[$0], city=[$1], $f2=[CASE(=($3, 0), null:BIGINT, $2)], $f3=[$3])
            LogicalTableScan(table=[[OpenSearch, _gathered_rows]])
