calcite:
  logical: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalProject(avg_balance=[$2], age_range=[$0], state=[$1])
        LogicalAggregate(group=[{0, 1}], avg_balance=[AVG($2)])
          LogicalProject(age_range=[CASE(<($10, 35), 'u35':VARCHAR, $11)], state=[$9], balance=[$7])
            CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_bank]])
  physical: |
    EnumerableLimit(fetch=[10000])
      EnumerableCalc(expr#0..2=[{inputs}], avg_balance=[$t2], age_range=[$t0], state=[$t1])
        EnumerableAggregate(group=[{0, 1}], avg_balance=[AVG($2)])
          EnumerableCalc(expr#0..18=[{inputs}], expr#19=[35], expr#20=[<($t10, $t19)], expr#21=['u35':VARCHAR], expr#22=[CASE($t20, $t21, $t11)], age_range=[$t22], state=[$t9], balance=[$t7])
            CalciteEnumerableIndexScan(table=[[OpenSearch, opensearch-sql_test_index_bank]])
  shardFragment: |
    LogicalAggregate(group=[{0, 1}], agg#0=[$SUM0($2)], agg#1=[COUNT($2)])
      LogicalProject(age_range=[CASE(<($10, 35), 'u35':VARCHAR, $11)], state=[$9], balance=[$7])
        CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_bank]])
  combine: "MERGE_AGG{groupKeys:[0, 1], aggs:[SUM0(2), SUM(3)]}"
  coordinatorTree: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalProject(avg_balance=[$2], age_range=[$0], state=[$1])
        LogicalProject(age_range=[$0], state=[$1], avg_balance=[/(CAST($2):DOUBLE, $3)])
          LogicalProject(age_range=[$0], state=[$1], $f2=[CASE(=($3, 0), null:BIGINT, $2)], $f3=[$3])
            LogicalTableScan(table=[[OpenSearch, _gathered_rows]])
