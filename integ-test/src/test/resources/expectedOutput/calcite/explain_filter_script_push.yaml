calcite:
  logical: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalProject(firstname=[$1], age=[$8])
        LogicalFilter(condition=[AND(=($1, 'Amber'), =(-($8, 2), 30))])
          CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_account]])
  physical: |
    EnumerableLimit(fetch=[10000])
      EnumerableCalc(expr#0..1=[{inputs}], expr#2=[2:BIGINT], expr#3=[-($t1, $t2)], expr#4=[30], expr#5=[=($t3, $t4)], proj#0..1=[{exprs}], $condition=[$t5])
        CalciteEnumerableIndexScan(table=[[OpenSearch, opensearch-sql_test_index_account]], PushDownContext=[[PROJECT->[firstname, age], FILTER->=($0, 'Amber')], OpenSearchRequestBuilder(sourceBuilder={"from":0,"timeout":"1m","query":{"bool":{"must":[{"term":{"firstname.keyword":{"value":"Amber","boost":1.0}}}],"adjust_pure_negative":true,"boost":1.0}},"_source":{"includes":["firstname","age"]}}, requestedTotalSize=2147483647, pageSize=null, startFrom=0)])
