calcite:
  logical: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalFilter(condition=[>($1, 29)])
        LogicalProject(projects.name=[$3], proj_name_len=[CHAR_LENGTH($3)])
          CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_deep_nested]])
  physical: |
    EnumerableLimit(fetch=[10000])
      EnumerableCalc(expr#0=[{inputs}], expr#1=[CHAR_LENGTH($t0)], expr#2=[29], expr#3=[>($t1, $t2)], proj#0..1=[{exprs}], $condition=[$t3])
        CalciteEnumerableIndexScan(table=[[OpenSearch, opensearch-sql_test_index_deep_nested]], PushDownContext=[[PROJECT->[projects.name]], OpenSearchRequestBuilder(sourceBuilder={"from":0,"timeout":"1m","_source":{"includes":["projects.name"]}}, requestedTotalSize=2147483647, pageSize=null, startFrom=0)])
