calcite:
  logical: |
    LogicalSystemLimit(fetch=[10000], type=[QUERY_SIZE_LIMIT])
      LogicalProject(name=[$0])
        LogicalFilter(condition=[REGEXP_CONTAINS($0, 'hello':VARCHAR)])
          CalciteLogicalIndexScan(table=[[OpenSearch, opensearch-sql_test_index_strings]])
  physical: |
    EnumerableLimit(fetch=[10000])
      EnumerableCalc(expr#0=[{inputs}], expr#1=['hello':VARCHAR], expr#2=[REGEXP_CONTAINS($t0, $t1)], name=[$t0], $condition=[$t2])
        CalciteEnumerableIndexScan(table=[[OpenSearch, opensearch-sql_test_index_strings]], PushDownContext=[[PROJECT->[name]], OpenSearchRequestBuilder(sourceBuilder={"from":0,"timeout":"1m","_source":{"includes":["name"]}}, requestedTotalSize=2147483647, pageSize=null, startFrom=0)])
